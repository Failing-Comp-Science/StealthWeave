openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stego
    description: Steganography capacity + container operations
  - name: steganalysis
    description: Classical LSB detectors (sequential Weighted Stego and related)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stego/capacity:
    post:
      operationId: stegoCapacity
      tags: [stego]
      summary: Compute payload capacity across all compression presets
      description: >
        Uploads a cover (image or video) and returns the maximum payload
        capacity for every compression preset, computed from the high-texture
        DCT block count (image) or usable I-frame DCT coefficient slots (video)
        at each preset's target quality. The cover type is detected server-side
        and the cover/payload matrix is enforced there:
        IMAGE cover -> {TEXT_MESSAGE, TEXT_FILE, IMAGE};
        VIDEO cover -> {TEXT_MESSAGE, TEXT_FILE, IMAGE}.
        Invalid combinations return 400.

        NOTE: modeled as POST (not GET) because a browser cannot attach a
        multipart file body to a GET request.
      parameters:
        - name: payload_type
          in: query
          required: true
          description: TEXT_MESSAGE | TEXT_FILE | IMAGE
          schema:
            $ref: "#/components/schemas/PayloadType"
        - name: preset
          in: query
          required: false
          description: >
            Unified user-facing preset (LOSSLESS | CHAT_STANDARD | CHAT_HD).
            An explicitly sent legacy `compression_preset` wins over it for old
            clients. Legacy tokens (LOCAL_HIGH_CAPACITY, light/standard/heavy,
            bare QF/CRF) are still accepted and resolve onto the unified axis.
            Default: LOSSLESS.
          schema:
            $ref: "#/components/schemas/Preset"
        - name: compression_preset
          in: query
          required: false
          description: "LEGACY: Channel compression preset (NO_COMPRESSION | CHAT_STANDARD | CHAT_HD)"
          schema:
            $ref: "#/components/schemas/CompressionPreset"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover]
              properties:
                cover:
                  type: string
                  format: binary
                  description: Cover image or video file
      responses:
        "200":
          description: Capacity for every preset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityResponse"
        "400":
          description: Invalid cover/payload combination or unreadable cover
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stego/image/encode:
    post:
      operationId: stegoImageEncode
      tags: [stego]
      summary: Embed a payload into an image cover
      description: >
        Embeds an HSTG v2 container into an image cover. PNG/BMP covers use the
        lossless spatial-LSB engine; JPEG covers use the block DCT-QIM engine.
        Returns the stego image bytes.
        `compress=false` (default) skips DEFLATE; `compress=true` applies it,
        and the container flag records which mode was used so decode needs no
        extra parameter.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cover:
                  type: string
                  format: binary
                  description: Cover image (PNG/BMP/JPEG)
                payload_type:
                  type: string
                  default: TEXT_MESSAGE
                preset:
                  type: string
                  default: LOSSLESS
                  description: Unified preset (LOSSLESS | CHAT_STANDARD | CHAT_HD); legacy tokens (LOCAL_HIGH_CAPACITY, light | standard | heavy, bare QF) still accepted
                password:
                  type: string
                  default: ""
                compress:
                  type: boolean
                  default: false
                  description: "LEGACY: Apply DEFLATE"
                compression_preset:
                  type: string
                  enum: [NO_COMPRESSION, CHAT_STANDARD, CHAT_HD]
                  default: NO_COMPRESSION
                  description: "LEGACY: Channel compression preset"
                carrier_preset:
                  type: string
                  enum: [chat_standard, chat_hd, lossless_high_capacity]
                  default: chat_standard
                  description: "LEGACY: Carrier preset"
                payload_compression:
                  type: string
                  enum: [NO_COMPRESSION, DEFLATE]
                  description: "LEGACY: Explicit payload compression choice"
                message:
                  type: string
                  default: ""
                payload_file:
                  type: string
                  format: binary
                payload_image:
                  type: string
                  format: binary
                  description: Payload image (IMAGE)
      responses:
        "200":
          description: Stego image bytes (PNG for LSB path, JPEG for DCT-QIM path)
          content:
            image/png:
              schema: {}
            image/jpeg:
              schema: {}
        "400":
          description: Invalid cover/payload combination or payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /steganalysis/sequential-ws:
    post:
      operationId: sequentialWsAnalyze
      tags: [steganalysis]
      summary: Sequential Weighted Stego scan for raster-prefix LSB replacement
      description: >
        Ker sequential WS on decoded RGB, independently per channel, with a
        logarithmic prefix (or window) grid and Benjamini–Hochberg correction.
        A suspicious decision is statistically suspicious for sequential LSB
        replacement; it does not prove hidden data exists.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover]
              properties:
                cover:
                  type: string
                  format: binary
                  description: Image to analyse (PNG/JPEG/BMP)
                candidate_min:
                  type: integer
                  description: Smallest prefix/window length in samples (default 256)
                candidate_max:
                  type: integer
                  description: Largest prefix/window length (default full channel)
                n_candidates:
                  type: integer
                  description: Optional fixed log-grid size; default doubles from min
                mode:
                  type: string
                  enum: [prefix, window]
                  default: prefix
      responses:
        "200":
          description: Sequential WS detector result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SequentialWsResult"
        "400":
          description: Not an image or decode failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stego/analyze:
    post:
      operationId: stegoAnalyze
      tags: [stego]
      summary: Run classical LSB steganalysis on an image
      description: >
        Uploads an image and returns chi-square, sample pair analysis,
        RS-analysis, primary sets, sequential Weighted Stego, and a sequential
        HSTG v1 header scan, plus an overall verdict (likely_clean |
        lsb_suspected). Verdict is this app's HSTG LSB wrapper, sequential WS,
        or SPA and RS together. Chi-square and primary sets are reported but do
        not vote. Short typed messages often miss WS but still carry the HSTG
        header. Leftover JPEG DCT-QIM files may look clean.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cover]
              properties:
                cover:
                  type: string
                  format: binary
                  description: Image to analyse (PNG/JPEG/BMP)
      responses:
        "200":
          description: Detector scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeResponse"
        "400":
          description: Not an image or decode failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stego/image/decode:
    post:
      operationId: stegoImageDecode
      tags: [stego]
      summary: Extract the payload from a stego image
      description: >
        Reads the container back from a PNG/BMP (LSB) or JPEG (DCT-QIM) stego
        image and returns the recovered payload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [stego]
              properties:
                stego:
                  type: string
                  format: binary
                  description: Stego image (PNG/JPEG)
                password:
                  type: string
                  default: ""
      responses:
        "200":
          description: Recovered payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodeResponse"
        "400":
          description: Wrong password, corrupted bytes, or not a stego image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stego/video/encode:
    post:
      operationId: stegoVideoEncode
      tags: [stego]
      summary: Embed a payload into a video cover
      description: >
        Embeds an HSTG v2 container into a video using the I-frame DCT-QIM
        engine with an H.264 CRF re-encode. Returns the stego MP4 bytes.
        `compress=false` (default) skips DEFLATE.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cover:
                  type: string
                  format: binary
                  description: Cover video
                payload_type:
                  type: string
                  enum: [TEXT_MESSAGE, TEXT_FILE, IMAGE]
                  default: TEXT_MESSAGE
                preset:
                  type: string
                  default: LOSSLESS
                  description: Unified preset (LOSSLESS | CHAT_STANDARD | CHAT_HD); legacy tokens (LOCAL_HIGH_CAPACITY, light | standard | heavy, bare CRF) still accepted
                password:
                  type: string
                  default: ""
                compress:
                  type: boolean
                  default: false
                  description: "LEGACY: Apply DEFLATE"
                compression_preset:
                  type: string
                  enum: [NO_COMPRESSION, CHAT_STANDARD, CHAT_HD]
                  default: NO_COMPRESSION
                  description: "LEGACY: Channel compression preset"
                carrier_preset:
                  type: string
                  enum: [chat_standard, chat_hd, lossless_high_capacity]
                  default: chat_standard
                  description: "LEGACY: Carrier preset"
                payload_compression:
                  type: string
                  enum: [NO_COMPRESSION, DEFLATE]
                  description: "LEGACY: Explicit payload compression choice"
                message:
                  type: string
                  default: ""
                payload_file:
                  type: string
                  format: binary
                payload_image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stego MP4 bytes
          content:
            video/mp4:
              schema: {}
        "400":
          description: Invalid cover/payload or payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /stego/video/decode:
    post:
      operationId: stegoVideoDecode
      tags: [stego]
      summary: Extract the payload from a stego video
      description: Reads the container back from a video and returns its payload.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [stego]
              properties:
                stego:
                  type: string
                  format: binary
                  description: Stego video
                password:
                  type: string
                  default: ""
      responses:
        "200":
          description: Recovered payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecodeResponse"
        "400":
          description: Wrong password, corrupted bytes, or not a stego video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PayloadType:
      type: string
      enum: [TEXT_MESSAGE, TEXT_FILE, IMAGE]
    CompressionPreset:
      type: string
      enum: [NO_COMPRESSION, CHAT_STANDARD, CHAT_HD]
    Preset:
      type: string
      enum: [LOSSLESS, CHAT_STANDARD, CHAT_HD]
    CoverType:
      type: string
      enum: [IMAGE, VIDEO]
    DecodeResponse:
      type: object
      required: [payload_type, container_version]
      properties:
        payload_type:
          $ref: "#/components/schemas/PayloadType"
        container_version:
          type: number
        original_filename:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        payload_base64:
          type: string
          nullable: true
        compressed:
          type: boolean
          nullable: true
    PresetCapacity:
      type: object
      required: [id, name, description, technique, expected_ber, survivability_description]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        technique:
          type: string
        expected_ber:
          type: number
        survivability_description:
          type: string
        preset_id:
          type: string
          nullable: true
          description: Unified user-facing preset id of this row (LOSSLESS | CHAT_STANDARD | CHAT_HD)
        preset_label:
          type: string
          nullable: true
          description: Human-readable label of the unified preset
        compression_preset:
          type: string
          nullable: true
        text_compression_factor:
          type: number
          nullable: true
        target_quality_factor:
          type: number
          nullable: true
        max_bytes_text_message:
          type: number
          nullable: true
        max_bytes_text_file:
          type: number
          nullable: true
        target_crf:
          type: number
          nullable: true
        max_bytes_per_minute_text_message:
          type: number
          nullable: true
        max_bytes_per_minute_text_file:
          type: number
          nullable: true
        max_bytes_image:
          type: number
          nullable: true
    CapacityResponse:
      type: object
      required: [cover_type, payload_type, compression_preset, allowed_payload_types, container_version, presets]
      properties:
        cover_type:
          $ref: "#/components/schemas/CoverType"
        payload_type:
          $ref: "#/components/schemas/PayloadType"
        compression_preset:
          $ref: "#/components/schemas/CompressionPreset"
        preset:
          $ref: "#/components/schemas/Preset"
          description: Unified user-facing preset echoed from the request; null when only a legacy compression_preset was sent
        allowed_payload_types:
          type: array
          items:
            $ref: "#/components/schemas/PayloadType"
        container_version:
          type: number
        presets:
          type: array
          items:
            $ref: "#/components/schemas/PresetCapacity"
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
    AnalyzeDetectorResult:
      type: object
      required: [detected]
      properties:
        detected:
          type: boolean
        stego_probability:
          type: number
          nullable: true
        chi2_stat:
          type: number
          nullable: true
        prefix_detected:
          type: boolean
          nullable: true
        estimated_payload:
          type: number
          nullable: true
    SequentialWsCandidate:
      type: object
      required: [end, raw_score]
      properties:
        end:
          type: integer
        raw_score:
          type: number
        adjusted_p_value:
          type: number
          nullable: true
    SequentialWsChannelScores:
      type: object
      required: [red, green, blue]
      properties:
        red:
          type: number
        green:
          type: number
        blue:
          type: number
    SequentialWsResult:
      type: object
      required:
        - detector
        - decision
        - score
        - estimated_change_rate
        - channel_scores
        - candidate_curve
        - runtime_ms
        - limitations
        - implementation_version
        - detected
      properties:
        detector:
          type: string
        decision:
          type: string
          enum: [clean, suspicious, inconclusive]
        score:
          type: number
          description: Maximum standardized WS statistic (z), not a probability
        p_value:
          type: number
          nullable: true
        estimated_change_rate:
          type: number
        estimated_payload_bits:
          type: integer
          nullable: true
        estimated_prefix_samples:
          type: integer
          nullable: true
        channel_scores:
          $ref: "#/components/schemas/SequentialWsChannelScores"
        candidate_curve:
          type: array
          items:
            $ref: "#/components/schemas/SequentialWsCandidate"
        runtime_ms:
          type: number
        limitations:
          type: array
          items:
            type: string
        implementation_version:
          type: string
        detected:
          type: boolean
    HstgHeaderScan:
      type: object
      required: [found]
      properties:
        found:
          type: boolean
        bits_per_channel:
          type: integer
          nullable: true
        payload_bytes:
          type: integer
          nullable: true
          description: v1 LENGTH field (encrypted wrapper size), not original payload size
        version:
          type: integer
          nullable: true
    AnalyzeResponse:
      type: object
      required: [verdict, chi_square, sample_pairs, rs_analysis, primary_sets, sequential_ws, hstg_header]
      properties:
        verdict:
          type: string
          enum: [likely_clean, lsb_suspected]
        chi_square:
          $ref: "#/components/schemas/AnalyzeDetectorResult"
        sample_pairs:
          $ref: "#/components/schemas/AnalyzeDetectorResult"
        rs_analysis:
          $ref: "#/components/schemas/AnalyzeDetectorResult"
        primary_sets:
          $ref: "#/components/schemas/AnalyzeDetectorResult"
        sequential_ws:
          $ref: "#/components/schemas/SequentialWsResult"
        hstg_header:
          $ref: "#/components/schemas/HstgHeaderScan"

